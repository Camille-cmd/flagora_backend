[project]
name = "flagora-backend"
version = "0.1.0"
description = "Backend for the Flagora app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels-redis>=4.2.1",
    "channels[daphne]>=4.2.2",
    "django>=6.1",
    "django-anymail[brevo]>=15.1",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.3",
    "python-dotenv>=1.2.3",
    "pillow>=12.3.0",
    "psycopg2>=2.9.12",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.4",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]
production = [
    "whitenoise>=6.12.0",
]

[tool.coverage.run]
omit = [
    "*/.local/*",
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "__init__.py",
    "settings.py"
]

[tool.coverage.report]
skip_empty = true
omit = [
    "*/.local/*",
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "__init__.py",
    "settings.py"
]
exclude_also = [
    "def __repr__",
    "def __str__",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "migrations"
]

[tool.autoflake]
imports = ["django", "requests", "urllib3"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
